version: '3'
services:
  app:
    build: .
    image: miniec-vial
    volumes:
      - /dev:/dev  # マイコンに flash するために mount する
      - ../keyboards:/home/vscode/vial-qmk/keyboards:cached
      - ../build:/home/vscode/vial-qmk/.build:cached
      - ../:/home/vscode/miniEC
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: /bin/sh -c "sleep infinity"
